[package]
name = "sealantern-connect"
version = "0.1.0"
description = "A lightweight Minecraft Java Edition join client powered by sculk"
authors = ["KercyDing"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sculk = "0.6.0"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
