[workspace]
members = ["src-tauri"]
resolver = "3"

[workspace.package]
version = "0.3.0"
description = "A lightweight Minecraft Java Edition join client powered by sculk"
repository = "https://github.com/SeaLantern-Studio/SeaLantern-Connect"
authors = ["SeaLantern-Studio"]
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
sculk = { version = "0.6.0", features = ["persist"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdb = "0.24"
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { version = "1", features = ["sync", "time"] }
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
