[workspace]
members = ["src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
description = "A lightweight Minecraft Java Edition join client powered by sculk"
repository = "https://github.com/SeaLantern-Studio/SeaLantern-Connect"
authors = ["SeaLantern-Studio"]
edition = "2024"

[workspace.dependencies]
sculk = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
