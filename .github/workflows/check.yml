name: "代码质量检查"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端检查 (Rust)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf nasm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 检查代码格式
        run: cargo fmt --all -- --check

      - name: 运行 Clippy 检查
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 运行测试
        run: cargo test --workspace

  frontend:
    name: 前端检查 (Node)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: 安装 pnpm
        run: corepack enable

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查前端格式
        run: pnpm fmt:check

      - name: 运行前端 Lint
        run: pnpm lint

      - name: 检查类型并构建前端
        run: pnpm build
